<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">Strata on Kaggle workflow</title>
  <desc id="desc">Configure Kaggle with Kaggle and ngrok secrets, restore or download the model and engine, launch authenticated Strata and an ngrok tunnel, verify the API, then connect OpenCode.</desc>
  <rect width="1100" height="330" rx="22" fill="#0b0e14"/>
  <text x="34" y="42" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f2f5f9">One notebook. A guided setup.</text>
  <text x="34" y="66" font-family="Inter,Arial,sans-serif" font-size="13" fill="#9aa4b5">Workflow overview · requires your own Kaggle account, GPU availability and secrets</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="30" y="102" width="190" height="170" rx="16" fill="#151a23" stroke="#263041"/>
    <circle cx="56" cy="128" r="14" fill="#38bdf8"/><text x="56" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#06121c">1</text>
    <text x="48" y="162" font-size="16" font-weight="700" fill="#f2f5f9">Configure Kaggle</text>
    <text x="48" y="186" font-size="12" fill="#9aa4b5">Enable Internet/GPU</text>
    <text x="48" y="205" font-size="12" fill="#9aa4b5">Add Kaggle + ngrok Secrets</text>
    <text x="48" y="224" font-size="12" fill="#9aa4b5">Choose supported model</text>
    <text x="48" y="252" font-size="11" fill="#7dd3fc">Manual account steps</text>
    <path d="M223 187 H246" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/><path d="M240 181 L247 187 L240 193" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="252" y="102" width="190" height="170" rx="16" fill="#151a23" stroke="#263041"/>
    <circle cx="278" cy="128" r="14" fill="#38bdf8"/><text x="278" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#06121c">2</text>
    <text x="270" y="162" font-size="16" font-weight="700" fill="#f2f5f9">Prepare files</text>
    <text x="270" y="186" font-size="12" fill="#9aa4b5">Restore private cache</text>
    <text x="270" y="205" font-size="12" fill="#9aa4b5">or download model</text>
    <text x="270" y="224" font-size="12" fill="#9aa4b5">and compatible engine</text>
    <text x="270" y="252" font-size="11" fill="#7dd3fc">Review launch plan</text>
    <path d="M445 187 H468" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/><path d="M462 181 L469 187 L462 193" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="474" y="102" width="190" height="170" rx="16" fill="#151a23" stroke="#263041"/>
    <circle cx="500" cy="128" r="14" fill="#38bdf8"/><text x="500" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#06121c">3</text>
    <text x="492" y="162" font-size="16" font-weight="700" fill="#f2f5f9">Launch Strata</text>
    <text x="492" y="186" font-size="12" fill="#9aa4b5">Load the model</text>
    <text x="492" y="205" font-size="12" fill="#9aa4b5">Enable API-key access</text>
    <text x="492" y="224" font-size="12" fill="#9aa4b5">Check local health</text>
    <text x="492" y="252" font-size="11" fill="#7dd3fc">Loaded = true</text>
    <path d="M667 187 H690" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/><path d="M684 181 L691 187 L684 193" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="696" y="102" width="175" height="170" rx="16" fill="#151a23" stroke="#263041"/>
    <circle cx="722" cy="128" r="14" fill="#38bdf8"/><text x="722" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#06121c">4</text>
    <text x="714" y="162" font-size="16" font-weight="700" fill="#f2f5f9">Secure tunnel</text>
    <text x="714" y="186" font-size="12" fill="#9aa4b5">Start ngrok</text>
    <text x="714" y="205" font-size="12" fill="#9aa4b5">Reject requests with</text>
    <text x="714" y="224" font-size="12" fill="#9aa4b5">no API key (401/403)</text>
    <text x="714" y="252" font-size="11" fill="#7dd3fc">Temporary HTTPS URL</text>
    <path d="M874 187 H897" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/><path d="M891 181 L898 187 L891 193" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="903" y="102" width="167" height="170" rx="16" fill="#102a3a" stroke="#38bdf8"/>
    <circle cx="929" cy="128" r="14" fill="#38bdf8"/><text x="929" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#06121c">5</text>
    <text x="921" y="162" font-size="16" font-weight="700" fill="#ffffff">Use OpenCode</text>
    <text x="921" y="186" font-size="12" fill="#c7d2e0">Add provider URL</text>
    <text x="921" y="205" font-size="12" fill="#c7d2e0">Store API key locally</text>
    <text x="921" y="224" font-size="12" fill="#c7d2e0">Test a short prompt</text>
    <text x="921" y="252" font-size="11" fill="#7dd3fc">Keep Kaggle running</text>
    <text x="34" y="306" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9aa4b5">First launch downloads files. Add Input restores cache data from Kaggle storage; it may still transfer/copy tens of GB into the session.</text>
  </g>
</svg>
